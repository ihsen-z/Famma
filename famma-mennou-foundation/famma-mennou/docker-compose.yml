# ============================================================
# FAMMA MENNOU — Local Development Environment
# WordPress + WooCommerce (Tunisia / COD-first)
# ============================================================
# Usage:
#   1. cp .env.example .env  (then edit values if needed)
#   2. docker compose up -d
#   3. bash scripts/setup.sh   (first run only — configures WP + Woo)
# ============================================================

services:
  db:
    image: mariadb:11.4
    container_name: famma_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    # WooCommerce courant exige WordPress 6.9 minimum. On epingle la
    # branche stable actuelle (7.0) plutot qu'un tag flottant, pour rester
    # reproductible (§28, §54). A garder aligne avec le coeur reellement
    # installe dans le volume wp_core : l'image officielle ne met PAS a
    # jour un site existant, elle ne copie les fichiers que si le
    # repertoire est vide.
    image: wordpress:7.0-php8.3-apache
    container_name: famma_wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}
      # ------------------------------------------------------------------
      # Pont .env -> PHP (§41).
      #
      # Ces variables sont lues par le mu-plugin famma-env, qui les
      # transforme en constantes FAMMA_*. On ne passe PAS par
      # WORDPRESS_CONFIG_EXTRA : l'image officielle n'ecrit wp-config.php
      # qu'a la creation du volume et ne le met jamais a jour ensuite, donc
      # toute variable ajoutee apres coup n'atteint jamais PHP. Constate a
      # l'execution : wp-config.php ne contenait aucune constante FAMMA_.
      #
      # WP_ENVIRONMENT_TYPE n'a pas besoin de mu-plugin : le coeur de
      # WordPress lit cette variable d'environnement directement.
      # ------------------------------------------------------------------
      WP_ENVIRONMENT_TYPE: ${WP_ENV:-local}
      FAMMA_WHATSAPP_NUMBER: ${FAMMA_WHATSAPP_NUMBER}
      FAMMA_META_PIXEL_ID: ${META_PIXEL_ID}
      FAMMA_META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      FAMMA_META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE}
      FAMMA_TIKTOK_PIXEL_ID: ${TIKTOK_PIXEL_ID}
      FAMMA_GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID}
      FAMMA_GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_HOME}');
        define('WP_SITEURL', '${WP_SITEURL}');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
        define('WP_MEMORY_LIMIT', '256M');
        define('AUTOMATIC_UPDATER_DISABLED', true);
    volumes:
      - wp_core:/var/www/html
      # Bind-mount our code so the custom plugin + child theme live in the repo:
      - ./wp-content/plugins/famma-core:/var/www/html/wp-content/plugins/famma-core
      - ./wp-content/themes/famma-child:/var/www/html/wp-content/themes/famma-child
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

  wpcli:
    image: wordpress:cli-php8.3
    container_name: famma_wpcli
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      # WP-CLI doit voir exactement le meme environnement que le site,
      # sinon un `wp eval` ne reflete pas le comportement reel.
      WP_ENVIRONMENT_TYPE: ${WP_ENV:-local}
      FAMMA_WHATSAPP_NUMBER: ${FAMMA_WHATSAPP_NUMBER}
      FAMMA_META_PIXEL_ID: ${META_PIXEL_ID}
      FAMMA_META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      FAMMA_META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE}
      FAMMA_TIKTOK_PIXEL_ID: ${TIKTOK_PIXEL_ID}
      FAMMA_GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID}
      FAMMA_GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION}
      HOME: /tmp
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/plugins/famma-core:/var/www/html/wp-content/plugins/famma-core
      - ./wp-content/themes/famma-child:/var/www/html/wp-content/themes/famma-child
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./scripts:/scripts
    # Kept idle; invoked on demand by scripts/setup.sh
    entrypoint: ["tail", "-f", "/dev/null"]

  # --- Optional developer tooling (safe to remove) ---
  phpmyadmin:
    image: phpmyadmin:5
    container_name: famma_pma
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
    profiles: ["tools"]

  # Pas dans le profil « tools » : WordPress y route tout son courrier via
  # le mu-plugin famma-local-mail. Derriere un profil, chaque e-mail
  # transactionnel echouait sur « sendmail: can't connect » (§34).
  mailpit:
    image: axllent/mailpit:latest
    container_name: famma_mail
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  db_data:
  wp_core:
