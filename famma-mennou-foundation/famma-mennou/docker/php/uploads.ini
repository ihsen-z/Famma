; ============================================================
; FAMMA MENNOU — surcharge PHP montée dans conf.d (§37)
; Ce fichier DOIT exister sur l'hôte : Docker crée sinon un
; répertoire du même nom dans conf.d, que PHP ne sait pas charger.
; ============================================================

file_uploads = On
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; WooCommerce envoie beaucoup de champs sur l'écran produit (variations,
; métadonnées) — la valeur par défaut de 1000 est trop basse.
max_input_vars = 3000
